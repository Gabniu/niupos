# Host reverse-proxy vhost for the NOVA POS API — pos.niuautomations.com
#
# Companion to novaauth.nginx.example.conf and deliberately the same shape:
# terminate TLS here, forward plain HTTP to the loopback port the container
# publishes.
#
# INSTALLING THIS FROM SCRATCH TAKES TWO STEPS, NOT ONE.
#
# This file names certificate files that do not exist until certbot has run,
# and nginx refuses to load a configuration referencing a missing certificate.
# So `certbot --nginx` cannot be used to bootstrap it: certbot shells out to
# `nginx -t`, that test fails on this very file, and certbot reports the
# confusing "nginx plugin is not working; there may be problems with your
# existing configuration".
#
# Obtain the certificate against a temporary HTTP-only vhost first:
#
#   sudo mkdir -p /var/www/certbot
#   # install a minimal port-80 server block for this hostname serving
#   # /.well-known/acme-challenge/ from /var/www/certbot, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d pos.niuautomations.com
#
# THEN copy this file over it and reload:
#
#   sudo cp novapos.nginx.example.conf /etc/nginx/sites-available/novapos
#   sudo ln -sf /etc/nginx/sites-available/novapos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renewals need none of this -- the certificate exists by then, and certbot's
# scheduled renewal replaces the files in place.
#
# The hostname is public and discoverable the moment a certificate is issued —
# issuance publishes it to the Certificate Transparency logs within minutes.
# "Nobody knows the URL" has not been a defence since CT became mandatory, so
# the access gate below is what actually restricts it, not obscurity.

server {
    listen 80;
    server_name pos.niuautomations.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pos.niuautomations.com;

    # certbot --nginx rewrites these in place.
    ssl_certificate     /etc/letsencrypt/live/pos.niuautomations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.niuautomations.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # POS is still being built, so keep it out of search results while the
    # surface is moving.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------------------------------------------------------------------
    # Access gate.
    # ---------------------------------------------------------------------
    # A single shared HTTP basic credential in front of everything. This is not
    # the application's authentication and does not replace it — it keeps
    # scanners and bots away from a schema that is still changing.
    #
    #   sudo htpasswd -c /etc/nginx/.htpasswd-novapos <username>
    #
    # To open the site to the public, delete these two lines and reload nginx.
    # Nothing else needs to change.
    auth_basic "NOVA POS";
    auth_basic_user_file /etc/nginx/.htpasswd-novapos;

    # Matches nginx and PHP inside the container (20m). Without it this proxy
    # is the lowest limit in the chain and would reject a large offline-sync
    # payload with a 413 before the application ever sees it.
    client_max_body_size 20m;

    # The API, routed here rather than through the front end.
    #
    # apps/web/next.config.ts has a rewrite that would forward these, but Next
    # evaluates rewrites() at BUILD time and freezes the destination into the
    # image, so its target cannot be configured per environment — the first
    # deploy of this stack 500'd on every API call because the baked value was
    # the local development address. Routing here is configurable, one hop
    # shorter, and visible in one file.
    #
    # Same origin as the front end, so still no CORS and no preflight.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
    }

    # Everything else is the Next.js front end.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Laravel builds absolute URLs from these. Without X-Forwarded-Proto it
        # emits http:// in redirects and signed links and the browser drops out
        # of HTTPS. bootstrap/app.php must trust the proxy for it to be
        # honoured — it does.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
    }

    # Exempt from basic auth so external uptime monitoring can reach it. This
    # is Laravel's built-in /up (bootstrap/app.php): a bare 200 that discloses
    # nothing about the application.
    # Still points at the API container directly: /up is Laravel's health route
    # and the front end has no equivalent, so proxying it through Next would
    # only report that Next is alive.
    location = /up {
        auth_basic off;
        proxy_pass http://127.0.0.1:3010/up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
}
