# Host reverse-proxy vhost for NOVA Identity — novaauth.niuautomations.com
#
# INSTALLING THIS FROM SCRATCH TAKES TWO STEPS, NOT ONE.
#
# This file names certificate files that do not exist until certbot has run,
# and nginx refuses to load a configuration referencing a missing certificate.
# `certbot --nginx` therefore cannot bootstrap it: certbot shells out to
# `nginx -t`, the test fails on this very file, and it reports the misleading
# "nginx plugin is not working; there may be problems with your existing
# configuration".
#
#   sudo mkdir -p /var/www/certbot
#   # install a minimal port-80 server block for this hostname serving
#   # /.well-known/acme-challenge/ from /var/www/certbot, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d novaauth.niuautomations.com
#   # THEN copy this file into place and reload.
#
# WHY THERE IS NO BASIC-AUTH GATE HERE, unlike novapos.nginx.example.conf.
#
# This is the identity provider. POS and Booking send users here to sign in and
# the browser is redirected back with an authorization code, so the hostname
# must be reachable by anyone who can reach those applications — a shared
# password in front of it would break every OAuth flow it exists to serve.
#
# What protects it instead is the application: AUTH_ALLOW_PUBLIC_SIGN_UP=false,
# so nobody can create an account, and the /setup bootstrap route is live only
# while AUTH_BOOTSTRAP_TOKEN is set AND the user table is empty. Both are
# properties of the service, not of this file.

server {
    listen 80;
    server_name novaauth.niuautomations.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name novaauth.niuautomations.com;

    ssl_certificate     /etc/letsencrypt/live/novaauth.niuautomations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novaauth.niuautomations.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # A sign-in page has no business in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # This host issues and accepts credentials, so tell browsers to refuse it
    # over plain HTTP from now on. Applied here rather than in the application
    # because it is a property of the hostname.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A sign-in form must never be framed by another site — that is the
    # clickjacking path to a credential capture.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Single upstream. Everything the service exposes lives behind one Next
    # server: the sign-in UI, /api/auth/*, the OIDC discovery document at
    # /.well-known/openid-configuration, and the JWKS endpoint. Splitting any
    # of those out here would only create a second place for them to drift.
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # better-auth builds absolute redirect URIs and validates callbacks
        # against BETTER_AUTH_URL, which is https. Without this the app sees a
        # plain-HTTP request and the scheme mismatch breaks the OAuth callback.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
