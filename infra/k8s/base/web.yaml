apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-web
  labels:
    app.kubernetes.io/name: nova-web
    app.kubernetes.io/part-of: nova-pos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-web
      app.kubernetes.io/part-of: nova-pos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-web
        app.kubernetes.io/part-of: nova-pos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: nova-pos/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef: {name: nova-web-config}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nova-web
spec:
  selector:
    app.kubernetes.io/name: nova-web
    app.kubernetes.io/part-of: nova-pos
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nova-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-web
      app.kubernetes.io/part-of: nova-pos
