; Process supervision for the NOVA POS API container.
;
; The container needs two long-running processes -- nginx and php-fpm -- and a
; container dies with PID 1. Backgrounding one of them from a shell script
; means the container survives that process crashing, silently serving 502s
; with a green "running" status. supervisord makes PID 1 something that
; actually watches both.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
; Start php-fpm first. nginx returns 502 for anything arriving before the
; FastCGI socket is listening, and the priority ordering shrinks that window.
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; If either process exits for good, take the whole container down rather than
; limping. Docker's restart policy then handles it, and the health of the
; container reflects the health of the request path.
[eventlistener:process-exit]
command = sh -c "printf 'READY\n'; while read -r line; do echo \"exiting: $line\" >&2; kill -SIGQUIT $PPID; done < /dev/stdin"
events = PROCESS_STATE_FATAL
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
