; PHP settings for the NOVA POS API container.
;
; Loaded as conf.d/nova.ini, so these override the distribution defaults
; without editing the base php.ini the image ships.

; ---------------------------------------------------------------------------
; Error handling -- the setting that matters most on a public test box.
; ---------------------------------------------------------------------------
; display_errors must stay Off regardless of Laravel's APP_DEBUG. Those are two
; independent switches, and this is the one that survives a mistake in the
; environment file. With APP_DEBUG=true Laravel's error page renders the full
; environment -- database password, APP_KEY, mail credentials -- to whoever
; triggered the exception. On an internet-facing host that is a credential
; disclosure reachable by causing any unhandled error.
;
; Errors still go to the log, which goes to stderr, which goes to `docker logs`.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Do not announce the PHP version in the X-Powered-By response header.
expose_php = Off

; ---------------------------------------------------------------------------
; Limits
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60

; Kept consistent with nginx's client_max_body_size (20m). If PHP's limit is
; the lower of the two, nginx accepts the whole upload and then PHP rejects it,
; which surfaces as a confusing empty $_FILES rather than a clear 413.
upload_max_filesize = 20M
post_max_size = 20M

; ---------------------------------------------------------------------------
; OPcache -- compiled bytecode reuse.
; ---------------------------------------------------------------------------
; Without this every request reparses every PHP file it touches, which for a
; modular Laravel application is hundreds of files per request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=0 means OPcache never checks whether a file changed on
; disk, which is correct here precisely because the code is baked into an
; immutable image -- it can only change by deploying a new one. If this image
; is ever run with the source bind-mounted for live editing, this must be 1 or
; edits will appear to have no effect.
opcache.validate_timestamps = 0

; ---------------------------------------------------------------------------
; Sessions
; ---------------------------------------------------------------------------
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
; Set through the environment rather than hardcoded, so the image still works
; over plain HTTP on a developer machine while requiring TLS once deployed.
session.cookie_secure = 1
session.use_strict_mode = 1
