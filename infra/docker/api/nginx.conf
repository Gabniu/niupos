# nginx inside the NOVA POS API container.
#
# This is the INNER server. It serves the application; TLS, the public
# hostname and any access restriction are the outer reverse proxy's job (see
# infra/reverse-proxy/). Keeping the split means this file is identical in
# every environment and only the outer vhost changes.

user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs go to the container's stdout so `docker logs` is the single place to
    # look. A file inside the container would be invisible and would grow
    # unbounded on a read-mostly test box nobody rotates.
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # A point-of-sale sync payload can carry a batch of offline transactions,
    # so the 1m default is too small. Kept explicit rather than inherited.
    client_max_body_size 20m;

    # Never advertise the exact nginx version -- it turns a version-specific
    # advisory into a targeted request.
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        # THE SINGLE MOST IMPORTANT LINE IN THIS FILE.
        #
        # The document root is public/, never the application root. Laravel
        # keeps .env, composer.json, storage/ and the whole source tree one
        # level above this directory. Rooting at /var/www/html instead would
        # make https://host/.env a plain file download -- the application's
        # database credentials and APP_KEY, served with a 200.
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Sent here rather than from the outer proxy so they hold no matter how
        # this container is fronted.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Defence in depth behind the document root. If a dotfile ever lands
        # inside public/ by accident, this refuses to serve it.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Laravel's front controller pattern: serve the file if it exists,
        # otherwise hand the path to index.php so the router can resolve it.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # SCRIPT_FILENAME is built from the resolved document root, and
            # fastcgi_split_path_info plus the try_files guard below are what
            # stop a request for /uploads/evil.jpg/x.php from being executed as
            # PHP -- the classic path-info remote code execution against
            # nginx + php-fpm.
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # The outer proxy terminates TLS, so without these Laravel builds
            # http:// URLs in redirects and signed links and the browser breaks
            # out of HTTPS. TrustProxies must also be configured application
            # side for these to be honoured.
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;

            fastcgi_read_timeout 60s;
        }
    }
}
