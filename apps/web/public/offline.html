<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>NIU POS — Offline</title>
    <style>
      :root { color-scheme: light; font-family: "Hanken Grotesk", system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fd; color: #0f172a; }
      main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid #dbe3ee; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgb(15 23 42 / 6%); }
      .brand { color: #18181b; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 18px 0 8px; font-size: 24px; font-weight: 500; letter-spacing: -.02em; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.6; }
      button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 10px; padding: 0 18px; background: #18181b; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8be8c9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">NIU POS</div>
      <h1>You’re offline</h1>
      <p>Reconnect to load the latest workspace. Previously visited pages remain available when they are cached on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
